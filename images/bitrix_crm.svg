<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="680" cy="100" r="140" fill="none" stroke="rgba(6, 182, 212, 0.12)" stroke-width="2"/>
  <circle cx="680" cy="100" r="80" fill="none" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Left Side: CRM Architecture Visual -->
  <rect x="70" y="80" width="320" height="290" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="70" y="80" width="320" height="38" rx="14" fill="rgba(30, 41, 59, 0.9)"/>
  <circle cx="95" cy="99" r="5" fill="#ef4444"/>
  <circle cx="112" cy="99" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="99" r="5" fill="#10b981"/>
  <text x="150" y="103" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">Bitrix24 Real Estate SPA</text>

  <!-- CRM Pipeline Cards inside UI mockup -->
  <rect x="90" y="136" width="280" height="42" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255,255,255,0.06)"/>
  <text x="105" y="161" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">🏢 Property Listings SPA</text>
  <text x="320" y="161" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">128 active</text>

  <rect x="90" y="188" width="280" height="42" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255,255,255,0.06)"/>
  <text x="105" y="213" fill="#a78bfa" font-family="'Inter', sans-serif" font-weight="600" font-size="12">🤝 Buyer Enquiries Matcher</text>
  <text x="325" y="213" fill="#10b981" font-family="'Inter', sans-serif" font-size="11">94% fit</text>

  <rect x="90" y="240" width="280" height="42" rx="6" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255,255,255,0.06)"/>
  <text x="105" y="265" fill="#34d399" font-family="'Inter', sans-serif" font-weight="600" font-size="12">⚡ Node.js Webhook Engine</text>
  <text x="325" y="265" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">OAuth</text>

  <rect x="90" y="292" width="280" height="60" rx="6" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.3)"/>
  <text x="105" y="315" fill="#06b6d4" font-family="'Inter', sans-serif" font-weight="600" font-size="12">🤖 Gemini AI Lead Generation</text>
  <text x="105" y="337" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10">Automated Property Recommendation</text>

  <!-- Right Side: Highlights & Badges -->
  <g transform="translate(430, 100)">
    <!-- Main Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="16" y="18" fill="#06b6d4" font-family="'Inter', sans-serif" font-weight="600" font-size="11">ENTERPRISE CRM</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">Bitrix24 Real Estate</text>
    <text x="0" y="95" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Smart Process Automations &amp; Custom API</text>

    <!-- Flow Connector -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="90" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="15" y="20" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11">Bitrix24</text>

      <path d="M 95 16 L 115 16" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
      
      <rect x="120" y="0" width="90" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
      <text x="135" y="20" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11">Node.js</text>

      <path d="M 215 16 L 235 16" stroke="#06b6d4" stroke-width="2"/>

      <rect x="240" y="0" width="90" height="32" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4"/>
      <text x="250" y="20" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="11">Gemini AI</text>
    </g>

    <!-- Key Metrics Tags -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="155" height="45" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">ARCHITECTURE</text>
      <text x="14" y="37" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Smart Process (SPA)</text>

      <rect x="165" y="0" width="155" height="45" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="179" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">INTEGRATION</text>
      <text x="179" y="37" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">OAuth &amp; Webhooks</text>
    </g>
  </g>
</svg>
