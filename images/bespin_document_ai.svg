<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bespinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c102b"/>
      <stop offset="50%" stop-color="#080b1e"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="indigoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bespinBg)"/>

  <!-- Background Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
  </g>

  <!-- Left Mockup: Salesforce Ingestion Pipeline -->
  <rect x="70" y="80" width="330" height="290" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.35)" stroke-width="1.5"/>
  <rect x="70" y="80" width="330" height="38" rx="14" fill="rgba(30, 41, 59, 0.9)"/>
  <circle cx="95" cy="99" r="5" fill="#ef4444"/>
  <circle cx="112" cy="99" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="99" r="5" fill="#10b981"/>
  <text x="150" y="103" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">Salesforce Document AI Pipeline</text>

  <!-- Flow Steps -->
  <rect x="90" y="135" width="290" height="44" rx="8" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)"/>
  <text x="105" y="162" fill="#818cf8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">📧 Email-to-Case Ingestion</text>
  <text x="325" y="162" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">PDF/CSV</text>

  <path d="M 235 179 L 235 195" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="90" y="195" width="290" height="44" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.25)"/>
  <text x="105" y="222" fill="#34d399" font-family="'Inter', sans-serif" font-weight="600" font-size="12">⚡ Queueable &amp; Batch Apex</text>
  <text x="315" y="222" fill="#10b981" font-family="'Inter', sans-serif" font-size="11">Async Run</text>

  <path d="M 235 239 L 235 255" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3"/>

  <rect x="90" y="255" width="290" height="44" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.25)"/>
  <text x="105" y="282" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">🧠 Document AI OCR Extract</text>
  <text x="300" y="282" fill="#06b6d4" font-family="'Inter', sans-serif" font-size="11">Named Creds</text>

  <rect x="90" y="312" width="290" height="40" rx="6" fill="rgba(255, 255, 255, 0.03)"/>
  <text x="105" y="336" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11">Invoices &amp; Credit Notes Reconciled ✓</text>

  <!-- Right Side Details -->
  <g transform="translate(435, 100)">
    <rect x="0" y="0" width="165" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="#6366f1" stroke-width="1"/>
    <text x="14" y="18" fill="#818cf8" font-family="'Inter', sans-serif" font-weight="600" font-size="11">SALESFORCE &amp; AI AUTOMATION</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">Bespin Document AI</text>
    <text x="0" y="95" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">Automated Invoice &amp; Credit Note Processing</text>

    <!-- Architecture Badges -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="145" height="46" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">ORCHESTRATION</text>
      <text x="14" y="37" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Batch &amp; Queueable</text>

      <rect x="155" y="0" width="160" height="46" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">INTEGRATION</text>
      <text x="14" y="37" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Named Credentials</text>
    </g>

    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="315" height="45" rx="8" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.2)"/>
      <text x="15" y="27" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="12">Auto-routes incoming PDF / CSV invoices to CRM</text>
    </g>
  </g>
