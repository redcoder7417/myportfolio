<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="lmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a151b"/>
      <stop offset="50%" stop-color="#071015"/>
      <stop offset="100%" stop-color="#02080b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#lmBg)"/>

  <!-- Subtle circles & radar grid -->
  <g stroke="rgba(16, 185, 129, 0.08)" stroke-width="1">
    <circle cx="230" cy="225" r="140" fill="none"/>
    <circle cx="230" cy="225" r="90" fill="none" stroke-dasharray="4 4"/>
    <circle cx="230" cy="225" r="40" fill="none"/>
  </g>

  <!-- Left: Conversational WhatsApp + Agentforce Interface Mockup -->
  <rect x="70" y="75" width="320" height="300" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
  <rect x="70" y="75" width="320" height="42" rx="14" fill="rgba(16, 185, 129, 0.15)"/>
  <circle cx="95" cy="96" r="6" fill="#10b981"/>
  <text x="110" y="100" fill="#f1f5f9" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Legend Motors AI Service Agent</text>
  <text x="340" y="100" fill="#10b981" font-family="'Inter', sans-serif" font-size="10">● Online</text>

  <!-- Chat Bubbles -->
  <rect x="85" y="130" width="220" height="48" rx="8" fill="rgba(30, 41, 59, 0.7)"/>
  <text x="97" y="150" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">Hi! I want to explore the new SUV</text>
  <text x="97" y="167" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">and book a test drive this Saturday.</text>

  <rect x="150" y="190" width="225" height="62" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)"/>
  <text x="162" y="209" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="11">Agentforce: Model Apex GT selected!</text>
  <text x="162" y="226" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="11">📍 Showroom booked for 2:00 PM</text>
  <text x="162" y="243" fill="#6ee7b7" font-family="'Fira Code', monospace" font-size="10">WhatsApp booking sent ✓</text>

  <rect x="85" y="265" width="290" height="42" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>
  <text x="100" y="290" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Flow Trigger: Lead created &amp; CRM synced</text>

  <!-- Right Details -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="165" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="18" fill="#34d399" font-family="'Inter', sans-serif" font-weight="600" font-size="11">AGENTFORCE &amp; AI AGENTS</text>

    <text x="0" y="65" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="700" font-size="28">Legend Motors</text>
    <text x="0" y="95" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14">WhatsApp AI Automotive Service Agent</text>

    <!-- Key Capabilities -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="150" height="46" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">AGENT PLATFORM</text>
      <text x="14" y="37" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Salesforce Agentforce</text>

      <rect x="160" y="0" width="150" height="46" rx="8" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">AUTOMATION</text>
      <text x="14" y="37" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Salesforce Flows</text>
    </g>

    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="310" height="45" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.2)"/>
      <text x="14" y="27" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="12">Vehicle discovery, test drives, &amp; human handoff</text>
    </g>
  </g>
</svg>
